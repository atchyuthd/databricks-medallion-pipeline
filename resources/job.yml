resources:
  jobs:
    ecommerce_lakehouse_pipeline:
      name: ecommerce_lakehouse_pipeline
      tasks:
        - task_key: catalog_setup
          notebook_task:
            notebook_path: ../notebooks/00_catalog_setup.py
        - task_key: load_sample_data
          depends_on:
            - task_key: catalog_setup
          notebook_task:
            notebook_path: ../notebooks/01_load_sample_data.py
        - task_key: dim_bronze
          depends_on:
            - task_key: load_sample_data
          notebook_task:
            notebook_path: ../notebooks/10_dim_bronze.py
        - task_key: dim_silver
          depends_on:
            - task_key: dim_bronze
          notebook_task:
            notebook_path: ../notebooks/20_dim_silver.py
        - task_key: dim_gold
          depends_on:
            - task_key: dim_silver
          notebook_task:
            notebook_path: ../notebooks/30_dim_gold.py
        - task_key: fact_bronze
          depends_on:
            - task_key: load_sample_data
          notebook_task:
            notebook_path: ../notebooks/11_fact_bronze.py
        - task_key: fact_silver
          depends_on:
            - task_key: fact_bronze
          notebook_task:
            notebook_path: ../notebooks/21_fact_silver.py
        - task_key: fact_gold
          depends_on:
            - task_key: dim_gold
            - task_key: fact_silver
          notebook_task:
            notebook_path: ../notebooks/31_fact_gold.py
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED
