resources:
  jobs:
    ecommerce_lakehouse_pipeline:
      name: ecommerce_lakehouse_pipeline
      tasks:
        - task_key: catalog_setup
          notebook_task:
            notebook_path: /Workspace/Users/atchyuth1@gmail.com/databricks-medallion-pipeline/notebooks/00_catalog_setup
            source: WORKSPACE
        - task_key: load_sample_data
          depends_on:
            - task_key: catalog_setup
          notebook_task:
            notebook_path: /Workspace/Users/atchyuth1@gmail.com/databricks-medallion-pipeline/notebooks/01_load_sample_data
            source: WORKSPACE
        - task_key: dim_bronze
          depends_on:
            - task_key: load_sample_data
          notebook_task:
            notebook_path: /Workspace/Users/atchyuth1@gmail.com/databricks-medallion-pipeline/notebooks/10_dim_bronze
            source: WORKSPACE
        - task_key: dim_silver
          depends_on:
            - task_key: dim_bronze
          notebook_task:
            notebook_path: /Workspace/Users/atchyuth1@gmail.com/databricks-medallion-pipeline/notebooks/20_dim_silver
            source: WORKSPACE
        - task_key: dim_gold
          depends_on:
            - task_key: dim_silver
          notebook_task:
            notebook_path: /Workspace/Users/atchyuth1@gmail.com/databricks-medallion-pipeline/notebooks/30_dim_gold
            source: WORKSPACE
        - task_key: fact_bronze
          depends_on:
            - task_key: load_sample_data
          notebook_task:
            notebook_path: /Workspace/Users/atchyuth1@gmail.com/databricks-medallion-pipeline/notebooks/11_fact_bronze
            source: WORKSPACE
        - task_key: fact_silver
          depends_on:
            - task_key: fact_bronze
          notebook_task:
            notebook_path: /Workspace/Users/atchyuth1@gmail.com/databricks-medallion-pipeline/notebooks/21_fact_silver
            source: WORKSPACE
        - task_key: fact_gold
          depends_on:
            - task_key: dim_gold
            - task_key: fact_silver
          notebook_task:
            notebook_path: /Workspace/Users/atchyuth1@gmail.com/databricks-medallion-pipeline/notebooks/31_fact_gold
            source: WORKSPACE
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ecommerce_dev
      performance_target: PERFORMANCE_OPTIMIZED